<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <script>
        // Applies a saved light/dark override before the first paint, so a fresh launch never
        // flashes the wrong theme while Blazor boots. citiz.js (loaded later) exposes the same
        // logic as citiz.setTheme for when the learner changes it in Settings.
        (function () {
            try {
                var theme = window.localStorage.getItem('citiz.theme');
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            } catch (e) { /* localStorage unavailable — fall back to system */ }
        })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Citiz</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Citiz.SharedUI/css/app.css" />
    <link rel="stylesheet" href="host.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="boot">
            <div class="boot-mark" aria-hidden="true"></div>
            <p>Loading Citiz…</p>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert" data-nosnippet>
        Something went wrong. Reloading the page usually fixes it; your progress is saved on this device.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">✕</button>
    </div>

    <script src="js/citiz.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>
</html>
