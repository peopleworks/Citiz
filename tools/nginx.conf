# nginx configuration for serving the published Blazor WebAssembly client.
server {
  listen 80;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;

  # The framework's own fingerprinted files can be cached forever; the entry points cannot.
  location ~* \.(wasm|dll|dat|blat|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(html|json|webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache";
  }

  # Deep links resolve client-side.
  location / {
    try_files $uri $uri/ /index.html =404;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;
}
